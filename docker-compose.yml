services:
  postgres:
    image: postgres:16-alpine
    container_name: hero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hero_accounting
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: hero_local_change_me
    ports:
      - "5432:5432"
    volumes:
      - hero_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero_accounting"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hero_postgres_data:
